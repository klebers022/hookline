name: hookline

# The app services run only with the "app" profile (pnpm stack:up), from
# images built by the Dockerfile. Without it, only the infrastructure starts,
# for the pnpm dev:* scripts.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-hookline}:${POSTGRES_PASSWORD:-hookline}@postgres:5432/${POSTGRES_DB:-hookline}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-hookline}:${RABBITMQ_PASSWORD:-hookline}@rabbitmq:5672
  # Development only, the same key as .env.example.
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-R/4NcjA3LApFWpimRkDtKcOD8JvYI0CMF2Q5RzJIyuA=}
  RETRY_DELAYS: ${RETRY_DELAYS:-1m,5m,30m,2h,6h}
  # Lets endpoints point at the test receiver inside this network. Local only.
  ALLOW_PRIVATE_TARGETS: 'true'
  # Every process serves /metrics, /healthz and /readyz on this port. It is
  # not published: only Prometheus, inside this network, reads it.
  METRICS_HOST: 0.0.0.0
  METRICS_PORT: '9464'
  # Traces go to Tempo, from the observability profile. While it is not
  # running, the spans are dropped and the app works the same.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}

x-api-image: &api-image
  image: hookline-api:${HOOKLINE_TAG:-local}
  build: { context: ., target: api }

x-worker-image: &worker-image
  image: hookline-worker:${HOOKLINE_TAG:-local}
  build: { context: ., target: worker }

# Asks a process's ops port whether it can do its work.
x-ops-healthcheck: &ops-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:9464/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
  interval: 5s
  timeout: 5s
  retries: 10

x-after-migrate: &after-migrate
  migrate: { condition: service_completed_successfully }
  rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookline}
      POSTGRES_DB: ${POSTGRES_DB:-hookline}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>. Without a
    # fixed hostname, each new container starts over with empty queues.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hookline}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hookline}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  migrate:
    <<: *api-image
    profiles: [app]
    command: ['node', 'dist/scripts/migrate.js']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api-image
    profiles: [app]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: hookline-api
    ports:
      - '127.0.0.1:3000:3000'
    depends_on: *after-migrate
    # Each process waits up to 30 seconds for its work in progress, and
    # Docker's default of 10 would kill it first.
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    <<: *worker-image
    profiles: [app]
    command:
      - node
      - --enable-source-maps
      - --import
      - '@hookline/shared/tracing'
      - dist/main-relay.js
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: hookline-relay
    depends_on: *after-migrate
    stop_grace_period: 35s
    healthcheck: *ops-healthcheck

  deliver:
    <<: *worker-image
    profiles: [app]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: hookline-deliver
    depends_on: *after-migrate
    stop_grace_period: 35s
    healthcheck: *ops-healthcheck

  test-receiver:
    image: hookline-test-receiver:${HOOKLINE_TAG:-local}
    build: { context: ., target: test-receiver }
    profiles: [app]
    ports:
      - '127.0.0.1:4000:4000'

  # Observability, with the "observability" profile (pnpm obs:up). It reads
  # the app services above, so start them with pnpm stack:up.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:3.1.1
    profiles: [observability]
    command: ['-config.file=/etc/tempo/tempo.yml']
    # OTLP over HTTP, for processes running outside the compose network.
    ports:
      - '127.0.0.1:4318:4318'
    volumes:
      - ./infra/observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.6.20
    profiles: [observability]
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./infra/observability/loki:/etc/loki:ro
      - loki-data:/loki

  # Collects the app containers' logs through the Docker socket (read-only)
  # and pushes them to Loki.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: [observability]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    environment:
      # Local only: anyone who opens the page is an admin, without a login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hookline-overview.json
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  tempo-data:
  loki-data:
