# The book of records. One pod with its own volume: a StatefulSet keeps the
# name postgres-0 and the same volume across restarts. The headless Service
# points the name "postgres" straight at the pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: POSTGRES_USER
              value: hookline
            - name: POSTGRES_DB
              value: hookline
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hookline-secrets, key: POSTGRES_PASSWORD }
            # A folder inside the volume, not its root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # After a crash Postgres replays its write-ahead log before taking
          # connections, and a busy node can take minutes. The liveness probe
          # only starts once this one passes, so recovery is never cut short.
          startupProbe:
            exec:
              command: [pg_isready, -U, hookline, -d, hookline]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, hookline, -d, hookline]
            periodSeconds: 5
            timeoutSeconds: 5
          # pg_isready exits 1 when the server answers but refuses
          # connections (recovering, shutting down) and 2 when it does not
          # answer at all. Only a server that stopped answering is restarted:
          # treating 1 as dead killed Postgres in the middle of its recovery
          # in the chaos test, and it was out for 84 s instead of 15.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U hookline -d hookline -t 4; [ $? -le 1 ]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/postgresql/data
      # The root filesystem is read-only; these are the places it writes.
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
