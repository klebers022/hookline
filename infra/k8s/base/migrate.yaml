# Brings the schema up to date. Argo CD runs it as a sync hook after
# Postgres (wave 0) and before the apps (wave 2), recreating it on every
# sync; without Argo CD, pnpm k8s:up deletes and reapplies it.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  # Postgres may still be starting: each failure is retried, with a growing wait.
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Never
      # k3s lets a new pod through the network policies a moment after it
      # starts; a pod that connects at once is refused. This waits for that.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready --host postgres --timeout 2; do sleep 1; done
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: migrate
          image: ghcr.io/klebers022/hookline-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: [node, dist/scripts/migrate.js]
          envFrom:
            - configMapRef: { name: hookline-config }
          # The passwords come first: $(NAME) only sees variables above it.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hookline-secrets, key: POSTGRES_PASSWORD }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: hookline-secrets, key: RABBITMQ_PASSWORD }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: hookline-secrets, key: ENCRYPTION_KEY }
            - name: DATABASE_URL
              value: postgres://hookline:$(POSTGRES_PASSWORD)@postgres:5432/hookline
            - name: RABBITMQ_URL
              value: amqp://hookline:$(RABBITMQ_PASSWORD)@rabbitmq:5672
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # The root filesystem is read-only; these are the places it writes.
      volumes:
        - name: tmp
          emptyDir: {}
