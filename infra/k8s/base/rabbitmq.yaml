# The conveyor belt. RabbitMQ keeps its queues under its node name,
# rabbit@<hostname>; the StatefulSet keeps the hostname rabbitmq-0, so a new
# pod finds the queues the old one left on the volume.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: rabbitmq:4.4-management-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: hookline
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: hookline-secrets, key: RABBITMQ_PASSWORD }
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # Booting takes a while; the other probes wait for this one.
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/rabbitmq
      # The root filesystem is read-only; these are the places it writes.
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
