# The restore test (pnpm k8s:restore-test): fetches the latest copy from the
# backup store, restores it into a throwaway Postgres inside this pod, and
# prints the row count of every table. The script compares those counts
# with the live database. A backup is only as good as the last restore that
# worked.
#
# Not part of the Kustomize base: the script applies it on demand.
apiVersion: batch/v1
kind: Job
metadata:
  name: restore-test
  namespace: hookline
  labels:
    app.kubernetes.io/part-of: hookline
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restore-test
        app.kubernetes.io/part-of: hookline
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch
          image: rclone/rclone:1.75.2
          command:
            - sh
            - -c
            - |
              set -e
              latest="$(rclone lsf store:hookline-backups | sort | tail -n 1)"
              if [ -z "$latest" ]; then
                echo "No backup in the store" >&2
                exit 1
              fi
              rclone copyto "store:hookline-backups/$latest" /restore/latest.dump
              echo "$latest" > /restore/name
          env:
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_CONFIG_STORE_TYPE
              value: s3
            - name: RCLONE_CONFIG_STORE_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_STORE_ENDPOINT
              value: http://backup-store:7070
            - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: hookline-backup, key: ACCESS_KEY_ID }
            - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: hookline-backup, key: SECRET_ACCESS_KEY }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: restore
              mountPath: /restore
            - name: tmp
              mountPath: /tmp
      containers:
        # A database of its own, on a local socket only, gone with the pod.
        # The counts go to the log as "count <table> <rows>" lines.
        - name: restore
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              set -e
              export PGHOST=/tmp PGUSER=hookline
              initdb --pgdata /tmp/pgdata --username hookline --auth trust >/dev/null
              pg_ctl --pgdata /tmp/pgdata --wait --silent \
                --options "-c listen_addresses='' -c unix_socket_directories=/tmp" start
              createdb hookline
              pg_restore --dbname hookline --no-owner --exit-on-error /restore/latest.dump
              echo "restored $(cat /restore/name)"
              psql --dbname hookline --tuples-only --no-align --field-separator ' ' --command "
                SELECT 'count', table_name,
                  (xpath('/row/c/text()', query_to_xml(
                    format('SELECT count(*) AS c FROM public.%I', table_name),
                    false, true, '')))[1]::text
                FROM information_schema.tables
                WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                ORDER BY table_name"
              pg_ctl --pgdata /tmp/pgdata --wait --silent stop
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: restore
              mountPath: /restore
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: restore
          emptyDir: {}
        - name: tmp
          emptyDir: {}
