# The test house, for demos and the smoke test only. Endpoints reach it at
# http://test-receiver:4000/hooks; its control routes are published on the
# same address as the dashboard, which has no routes by those names.
apiVersion: v1
kind: Service
metadata:
  name: test-receiver
spec:
  selector:
    app.kubernetes.io/name: test-receiver
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-receiver
    spec:
      containers:
        - name: test-receiver
          image: ghcr.io/klebers022/hookline-test-receiver
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-receiver
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /control
            pathType: Exact
            backend:
              service:
                name: test-receiver
                port: { name: http }
          - path: /received
            pathType: Exact
            backend:
              service:
                name: test-receiver
                port: { name: http }
