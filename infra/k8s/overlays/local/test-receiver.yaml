# The test house, for demos and the smoke test only. Endpoints reach it at
# http://test-receiver:4000/hooks; its control routes are published on the
# same address as the dashboard, which has no routes by those names.
apiVersion: v1
kind: Service
metadata:
  name: test-receiver
spec:
  selector:
    app.kubernetes.io/name: test-receiver
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: test-receiver
          image: ghcr.io/klebers022/hookline-test-receiver
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # The root filesystem is read-only; these are the places it writes.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-receiver
  annotations:
    # Traefik ranks rules by their length, and Path(`/stats`) is shorter
    # than the dashboard's PathPrefix(`/`): without this, the dashboard
    # would answer.
    traefik.ingress.kubernetes.io/router.priority: '100'
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # /control and /control/<destination>.
          - path: /control
            pathType: Prefix
            backend:
              service:
                name: test-receiver
                port: { name: http }
          - path: /stats
            pathType: Exact
            backend:
              service:
                name: test-receiver
                port: { name: http }
          - path: /reset
            pathType: Exact
            backend:
              service:
                name: test-receiver
                port: { name: http }
          - path: /received
            pathType: Exact
            backend:
              service:
                name: test-receiver
                port: { name: http }
---
# The postman delivers to it; Traefik publishes its control routes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-receiver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: test-receiver
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: deliver
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4000
