# The chaos test's cluster (pnpm k8s:up chaos, then pnpm chaos): the images
# built from this checkout, as in CI, and the real retry policy with waits
# of seconds instead of hours, so 10,000 events finish in minutes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../ci
configMapGenerator:
  - name: hookline-config
    behavior: merge
    literals:
      # Six tries over almost 5 minutes. A delivery is given up on when the
      # schedule ends, even while the circuit is open, so it must outlast
      # the 2 minutes the outage destination is away.
      - RETRY_DELAYS=5s,10s,30s,60s,180s
      # A failing endpoint is tried again after 15 s, not 5 minutes.
      - CIRCUIT_OPEN_SECONDS=15
      # High enough that the test measures the failures, not the limits.
      - RATE_LIMIT_PER_MINUTE=100000
      - ENDPOINT_RATE_LIMIT_PER_SECOND=10000
