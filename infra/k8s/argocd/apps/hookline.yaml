# The app: the local overlay, with the images pnpm k8s:bump pinned.
# selfHeal undoes any change made by hand in the cluster; prune deletes what
# was removed from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hookline
  namespace: argocd
spec:
  project: hookline
  source:
    repoURL: https://github.com/klebers022/hookline.git
    targetRevision: main
    path: infra/k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: hookline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
