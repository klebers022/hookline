name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Builds the images and runs the whole stack in containers, end to end.
  infra:
    runs-on: ubuntu-latest
    env:
      # A delivery runs out of attempts in seconds, for the Playwright test.
      RETRY_DELAYS: 1s,1s,1s,1s,1s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Unit tests for the Prometheus alert rules.
      - run: docker run --rm -v ./infra/observability/prometheus:/rules -w /rules --entrypoint promtool prom/prometheus:v3.16.0 test rules alerts.test.yml
      - run: docker compose --profile app up -d --build --wait
      - run: node scripts/smoke.mjs
      - run: pnpm install --frozen-lockfile --filter @hookline/e2e
      - run: pnpm --filter @hookline/e2e exec playwright install --with-deps chromium
      - run: pnpm stack:e2e
        env:
          CI: 'true'
      # The trace of a failed test: every step, with the page and network.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose --profile app logs
      - if: always()
        run: docker compose --profile app down --volumes

  # The same stack in Kubernetes: a k3d cluster on the runner, with the
  # images built from this commit imported into it (they are not on GHCR
  # yet), and the smoke test against it.
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Every manifest of every overlay against the Kubernetes schemas.
      - name: Validate the manifests
        run: |
          for overlay in local ci; do
            kubectl kustomize "infra/k8s/overlays/$overlay" |
              docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary -
          done
      - name: Install k3d
        run: |
          curl -fsSL -o k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo install k3d /usr/local/bin/k3d
          k3d version
      - run: node scripts/k8s.mjs images
      - run: node scripts/k8s.mjs up ci
      - run: node scripts/smoke.mjs --k8s
      - if: failure()
        run: |
          kubectl --namespace hookline get all
          kubectl --namespace hookline get events --sort-by=.lastTimestamp
          for pod in $(kubectl --namespace hookline get pods --output name); do
            echo "::group::$pod"
            kubectl --namespace hookline logs "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
